[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dupe-finder-cli"
version = "2.0.0"
description = "Find and remove duplicate files across drives, safely (report, dry-run, Recycle Bin, keep-one-per-group)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anindya Chakraborty", email = "anindya.chakraborty@gmail.com" }]
keywords = ["duplicate", "duplicates", "dedupe", "deduplication", "files", "cleanup", "recycle", "disk-space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Better cross-platform Recycle Bin / Trash support. On Windows the tool falls
# back to the native shell API via ctypes, so this is optional there.
recycle = ["send2trash>=1.8"]

[project.scripts]
dupe-finder = "dupe_finder:run"

[project.urls]
Homepage = "https://github.com/canindya/dupe-finder-cli"
Repository = "https://github.com/canindya/dupe-finder-cli"
Issues = "https://github.com/canindya/dupe-finder-cli/issues"

[tool.setuptools]
py-modules = ["dupe_finder"]
